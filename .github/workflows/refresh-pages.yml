name: Refresh GitHub Pages

# Rebuilds the site daily so build-time GitHub metadata
# (e.g. ballistic-solver star/fork counts) stays current.
on:
  schedule:
    - cron: "17 18 * * *"   # 03:17 KST
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
